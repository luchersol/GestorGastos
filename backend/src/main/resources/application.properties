spring.application.name=gestorgastos

# =================================
# DATABASE - SQLITE
# =================================

spring.datasource.url=jdbc:sqlite:./backend/data/gestor-gastos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# =================================
# JPA / HIBERNATE
# =================================

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Actualizar automáticamente el esquema
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar consultas SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =================================
# BACKUPS
# =================================


# Copias de seguridad
app.backup.directory=${APP_DATA_DIR:./backend/data}/backups
#app.backup.directory=${user.home}/.gestorgastos/backups

# Retención
app.backup.daily-retention=7
app.backup.weekly-retention=4
app.backup.monthly-retention=6

